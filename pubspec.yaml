name: gps_camera
description: "GPS Camera - location stamped photos with real EXIF metadata editing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management & navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  # Storage
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  # Camera, location, maps
  camera: ^0.12.2
  geolocator: ^14.0.1
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # Platform integration
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  gal: ^3.0.0
  # Utilities
  dio: ^5.11.1
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  # Open-licensed fonts bundled so stamps render identically offline.
  # Inter, Lora, Oswald: SIL Open Font License 1.1. Roboto Mono: Apache 2.0.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-BoldItalic.ttf
          weight: 700
          style: italic
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoMono-Italic.ttf
          style: italic
        - asset: assets/fonts/RobotoMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700

# App icon (regenerate: flutter test tool/icon/generate_icon_test.dart && dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
